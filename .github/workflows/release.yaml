name: release

# Build and publish the arm64 (Raspberry Pi 4/5) packages.
#
#   * push a tag, e.g. `git tag 1.0.0 && git push origin 1.0.0`
#       -> deb/rpm/apk are built, attached to a draft GitHub release and
#          published to Cloudsmith (when the publish secrets are configured)
#   * run manually (workflow_dispatch)
#       -> same packages are built and uploaded to the run as artifacts,
#          nothing is published
#
# Everything runs in a single job on an arm64 runner: the module and the
# rpi-fw-crypto CLI are compiled once against glibc (in a Debian container, for
# the deb and rpm packages) and once against musl (in an Alpine container, for
# the apk package), because a glibc shared object cannot be loaded by musl.
# Both builds package with nfpm into the same ./dist directory.

permissions:
  contents: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  ARCH: arm64
  # Oldest supported glibc target: building here is what makes the packages
  # work on Raspberry Pi OS bullseye as well as bookworm and trixie. See
  # ci/check-glibc.sh, which fails the build if this ever slips.
  GLIBC_IMAGE: debian:bullseye
  MAX_GLIBC: "2.28"
  MUSL_IMAGE: alpine:3.20

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-24.04-arm
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      PUBLISH_OWNER: ${{ secrets.PUBLISH_OWNER }}
      PUBLISH_REPO: ${{ secrets.PUBLISH_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.17.0"

      # CGO_ENABLED=0 keeps nfpm a static binary, so the same one can be
      # mounted into every container, including the musl based Alpine one.
      - name: Install nfpm
        run: CGO_ENABLED=0 go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Tag pushes are released under the tag name (a leading "v" is stripped
      # by ci/build.sh); manual runs produce a dev snapshot version.
      - name: Set version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "Building version $version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # Built against the oldest glibc that is still supported, so the
      # binaries also run on every newer release (glibc is backwards, not
      # forwards, compatible). ci/build.sh fails if the resulting binaries
      # need anything newer than MAX_GLIBC.
      - name: Build and package (glibc - deb, rpm)
        run: |
          ci/run-in-container.sh "$GLIBC_IMAGE" \
            'apt-get update && apt-get install -y --no-install-recommends build-essential cmake libgnutls28-dev'
        env:
          SEMVER: ${{ env.RELEASE_VERSION }}
          PACKAGERS: deb rpm

      - name: Build and package (musl - apk)
        run: |
          ci/run-in-container.sh "$MUSL_IMAGE" \
            'apk add --no-cache build-base cmake gnutls-dev'
        env:
          SEMVER: ${{ env.RELEASE_VERSION }}
          PACKAGERS: apk

      # Installed on the oldest supported glibc (the build image) and on a
      # current one, to prove the packages are not tied to the build image.
      - name: Verify the packages install
        run: |
          for image in "$GLIBC_IMAGE" debian:trixie; do
            docker run --rm -v "$PWD:/src" -w /src "$image" sh -eux -c '
              apt-get update && apt-get install -y ./dist/*.deb
              test -f /usr/lib/pkcs11/rpifwcrypto-pkcs11.so
              test -f /usr/share/p11-kit/modules/rpifwcrypto.module
              rpi-fw-crypto 2>&1 | head -n 3 || true'
          done
          docker run --rm -v "$PWD:/src" -w /src almalinux:9 sh -eux -c '
            dnf -y install ./dist/*.rpm
            test -f /usr/lib/pkcs11/rpifwcrypto-pkcs11.so
            rpi-fw-crypto 2>&1 | head -n 3 || true'
          docker run --rm -v "$PWD:/src" -w /src "$MUSL_IMAGE" sh -eux -c '
            apk add --allow-untrusted dist/*.apk
            test -f /usr/lib/pkcs11/rpifwcrypto-pkcs11.so
            rpi-fw-crypto 2>&1 | head -n 3 || true'

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          draft: true
          files: |
            ./dist/*.deb
            ./dist/*.rpm
            ./dist/*.apk

      # Skipped (without failing) when the Cloudsmith secrets are not set
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && env.PUBLISH_TOKEN
        run: ./ci/publish.sh ./dist --repo "$PUBLISH_REPO" --owner "$PUBLISH_OWNER"
